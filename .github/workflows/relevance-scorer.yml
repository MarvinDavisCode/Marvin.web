name: Relevance Scorer

# Stage 2 of the Editorial OS: reads Candidates with Status "New", scores
# each against the Focus Areas taxonomy using Claude, and writes a full
# draft into the Drafts table (Status "Needs Review") for the promising
# ones. Nothing this workflow does ever publishes or sends anything —
# every draft waits for Marvin's review in Airtable. See automation/README.md.
#
# Runs an hour after Source Monitor so the same day's new candidates are
# already in Airtable by the time this looks for them.

on:
  schedule:
    - cron: '0 7 * * *'   # daily, 07:00 UTC (~10:00 Africa/Nairobi)
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  score-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run relevance scorer
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: appGoegWQtI3TmtNW
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/scripts/relevance_scorer.py
