name: Weekly Newsletter

# Stage 4 of the Editorial OS: once a week, compiles the content for the
# next Afrinex issue — a recap of any blog post(s) published/PR'd this
# week, plus a short AI-written blurb for each Candidate Stage 2 flagged as
# a "Newsletter Candidate" but not a full post. Everything is written into
# a new Weekly Newsletters row's "Compiled Body" field for Marvin to review
# directly in Airtable. Nothing is published anywhere yet — once Marvin
# adds an Editor's Note and sets that row's Status to "Approved", the
# Publish Approved Drafts workflow turns it into a real page in the
# Afrinex section of the site. See automation/README.md.

on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays, 06:30 UTC (~09:30 Nairobi) — after that
                             # morning's Source Monitor + Relevance Scorer runs
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  compile-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run weekly newsletter compiler
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: appGoegWQtI3TmtNW
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variable (Settings -> Secrets and variables -> Actions
          # -> Variables tab, not Secrets — it isn't sensitive), e.g.
          # "https://marvindarvis.com/". Used so the blog recap can link
          # straight to the Insights page. Leave unset to mention posts
          # without a link.
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python automation/scripts/weekly_newsletter.py
